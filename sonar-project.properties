# Configuración del proyecto para SonarCloud
# Evaluación Parcial N° 2 - Ciclo de Vida del Software I (AUY1102)
# Grupo 5: Christian Reyes (ChRiStIaNo0O) y Danilo Romero G. (DMROMEROG)

sonar.projectKey=CVDS-Grupo5_AUY1102-Pipeline
sonar.projectName=AUY1102-Pipeline

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

# Reporte de cobertura generado por Jest / Istanbul
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de análisis
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts
sonar.sourceEncoding=UTF-8
